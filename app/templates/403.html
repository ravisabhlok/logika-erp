{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="card p-4 text-center" style="max-width: 520px; margin: 2rem auto;">
  <div class="mb-2"><i class="bi bi-lock" style="font-size: 2rem; color: #dc2626;"></i></div>
  <h5 class="mb-2">You don't have access to this</h5>
  <p class="text-muted mb-3">
    Your account doesn't have permission to <strong>{{ action }}</strong> {{ module_label }}.
    Ask an administrator to grant this from Roles &amp; Users.
  </p>
  <a href="/" class="btn btn-dark btn-sm">Back to Dashboard</a>
</div>
{% endblock %}
