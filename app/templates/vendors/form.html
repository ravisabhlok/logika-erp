{% extends "base.html" %}
{% block title %}{{ "Edit" if vendor else "New" }} Vendor{% endblock %}
{% block content %}
<h4 class="mb-3">{{ "Edit" if vendor else "New" }} Vendor</h4>
<div class="card p-4" style="max-width: 600px;">
  <form method="post" action="{{ '/vendors/%d/edit' % vendor.id if vendor else '/vendors/new' }}">
    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" name="name" class="form-control" value="{{ vendor.name if vendor else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contact Person</label>
      <input type="text" name="contact_person" class="form-control" value="{{ vendor.contact_person if vendor else '' }}">
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ vendor.phone if vendor else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ vendor.email if vendor else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ vendor.address if vendor else '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">GSTIN</label>
      <input type="text" name="gstin" class="form-control" value="{{ vendor.gstin if vendor else '' }}">
    </div>
    <button type="submit" class="btn btn-dark">Save</button>
    <a href="/vendors" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
