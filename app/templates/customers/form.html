{% extends "base.html" %}
{% block title %}{{ "Edit" if customer else "New" }} Customer{% endblock %}
{% block content %}
<h4 class="mb-3">{{ "Edit" if customer else "New" }} Customer</h4>
<div class="card p-4" style="max-width: 600px;">
  <form method="post" action="{{ '/customers/%d/edit' % customer.id if customer else '/customers/new' }}">
    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" name="name" class="form-control" value="{{ customer.name if customer else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nickname</label>
      <input type="text" name="nickname" class="form-control" value="{{ customer.nickname if customer else '' }}" placeholder="Short name used internally, if different from the full name">
    </div>
    <div class="mb-3">
      <label class="form-label">Contact Person</label>
      <input type="text" name="contact_person" class="form-control" value="{{ customer.contact_person if customer else '' }}">
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" value="{{ customer.city if customer else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">State</label>
        <input type="text" name="state" class="form-control" value="{{ customer.state if customer else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Country</label>
        <input type="text" name="country" class="form-control" value="{{ customer.country if customer else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">GSTIN</label>
      <input type="text" name="gstin" class="form-control" value="{{ customer.gstin if customer else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select name="category" class="form-select">
        <option value="">-- select category --</option>
        <option value="OEM" {% if customer and customer.category == 'OEM' %}selected{% endif %}>OEM</option>
        <option value="Enduser" {% if customer and customer.category == 'Enduser' %}selected{% endif %}>Enduser</option>
        <option value="Dealer" {% if customer and customer.category == 'Dealer' %}selected{% endif %}>Dealer</option>
      </select>
    </div>
    <button type="submit" class="btn btn-dark">Save</button>
    <a href="/customers" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
